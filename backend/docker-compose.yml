services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: breno
      POSTGRES_PASSWORD: breno
      POSTGRES_DB: breno_finance
    ports:
      - "5432:5432"
    volumes:
      - breno_finance_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U breno -d breno_finance"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  breno_finance_db:
